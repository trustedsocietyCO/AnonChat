<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RoomChat — no sign-up chat rooms</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main id="home" class="screen">
  <div class="card">
    <h1>💬 RoomChat</h1>
    <p class="sub">No accounts. Create a room, share the code, chat.</p>
    <label>Your nickname
      <input id="nick" maxlength="32" placeholder="e.g. Alex" autocomplete="off" />
    </label>
    <div class="split">
      <section>
        <h2>Create a room</h2>
        <input id="roomName" maxlength="48" placeholder="Room name (optional)" autocomplete="off" />
        <button id="createBtn" class="primary">Create room</button>
      </section>
      <section>
        <h2>Join a room</h2>
        <input id="joinCode" maxlength="9" placeholder="8-character code" autocomplete="off" class="mono" />
        <button id="joinBtn">Join</button>
      </section>
    </div>
    <p id="homeErr" class="err" role="alert"></p>
    <p class="fine">Rooms and messages are deleted 24 hours after the last activity.</p>
  </div>
</main>

<main id="chat" class="screen hidden">
  <header>
    <button id="leaveBtn" class="ghost" title="Leave room">←</button>
    <div class="title">
      <strong id="roomTitle">Room</strong>
      <span id="online" class="muted"></span>
    </div>
    <button id="codeBtn" class="code mono" title="Copy invite link"></button>
  </header>
  <div id="messages" aria-live="polite"></div>
  <form id="sendForm">
    <textarea id="text" rows="1" maxlength="2000" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="primary" type="submit">Send</button>
  </form>
  <div id="toast" class="toast hidden"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
